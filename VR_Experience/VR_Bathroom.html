<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR_Bathroom</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
     <script src="https://unpkg.com/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
</head>
<body>
    <a-scene>
        <a-assets>
            <img id="marble-texture" src="Assets_Bathroom/marble_texture/marble_86_basecolor-1k.png">
            <a-mixin id="wall" geometry="primitive: box; width: 2; height: 5; depth: 0.3"></a-mixin>
            <a-mixin id="primary" material="color: white"></a-mixin>
            <a-mixin id="secondary" material="color: gray"></a-mixin>
            <a-mixin id="stall wall" geometry="depth: 0.22; width: 6" material="color: white"></a-mixin>
            <a-mixin id="plane" geometry="primitive: plane; "depth: 0.22; width: 6 material="color: white"></a-mixin>



        </a-assets>

         <a-entity id="player" position="0 1.6 0">
            <!-- camera -->
            <a-entity id="camera" camera wasd-controls look-controls></a-entity>
            <!-- hand controls -->
            <a-entity  class="floor" id="left-hand" raycaster="objects: .floor" oculus-touch-controls="hand: left" blink-controls></a-entity>
            <a-entity  class="floor" id="right-hand" raycaster="objects: .floor" oculus-touch-controls="hand: right" blink-controls></a-entity>
        </a-entity>
        <a-entity mixin="wall primary" position="0 2.5 -14.30587" geometry="width: 29">Back Wall</a-entity>
        <a-entity mixin="wall primary" position="-14.3489 2.5 -4.8876" geometry="width: 19.14" rotation="0 90 0">Left wall</a-entity>
        <a-entity mixin="wall primary" position="14.37429 2.5 4.92403" geometry="width: 19.07" rotation="0 90 0">Right wall</a-entity>
        <a-entity mixin="wall primary" position="14.37429 2.5 -11.13354" geometry="width: 6.65" rotation="0 90 0">Right wall small</a-entity>
        <a-entity mixin="wall primary" position="-8.71176 2.5 14.35192" geometry="depth: 0.22; width: 11">Left Front Wall</a-entity>
        <a-entity mixin="wall primary" position="8.733 2.5 14.35192" geometry="depth: 0.22; width: 11">Right Front Wall</a-entity>


        <a-entity id="stall walls R" position="0 0 -0.98971">
            <a-entity mixin="wall primary" position="11.22398 2.5 10.01266" geometry="depth: 0.22; width: 6">wall by sink</a-entity>
            <a-entity mixin="wall primary" position="11.22398 2.5 5.5483" geometry="depth: 0.22; width: 6">stall wall 2</a-entity>
            <a-entity mixin="wall primary" position="11.22398 2.5 1" geometry="depth: 0.22; width: 6">stall wall 3</a-entity>
            <a-entity mixin="wall primary" position="11.22398 2.5 -3.51226" geometry="depth: 0.22; width: 6">stall wall 4</a-entity>
        </a-entity>

        <a-entity id="stall walls L" position="-22.44003 0 -0.98971">
            <a-entity mixin="wall primary" position="11.22398 2.5 5.5483" geometry="depth: 0.22; width: 6">stall wall 2</a-entity>
            <a-entity mixin="wall primary" position="11.22398 2.5 1" geometry="depth: 0.22; width: 6">stall wall 3</a-entity>
            <a-entity mixin="wall primary" position="11.22398 2.5 -3.51226" geometry="depth: 0.22; width: 6">stall wall 4</a-entity>
        </a-entity>
        <a-entity id="baby change R">
            <a-entity mixin="wall primary" position="7.01127 2.5 -12.42509" geometry="width: 3.5" rotation="0 90 0">baby change wall</a-entity>
            <a-entity mixin="wall primary" position="11.78039 2.5 -7.93503" geometry="depth: 0.22; width: 4.99">baby change wall 2</a-entity>
            <a-entity mixin="wall primary" position="14.37429 2.5 -11.13354" geometry="width: 6.65" rotation="0 90 0">wall small</a-entity>
        </a-entity>

         <a-entity id="baby change L">
            <a-entity mixin="wall primary" position="7.01127 2.5 -12.42509" geometry="width: 3.5" rotation="0 90 0">baby change wall</a-entity>
            <a-entity mixin="wall primary" position="11.78039 2.5 -7.93503" geometry="depth: 0.22; width: 4.99">baby change wall 2</a-entity>
            <a-entity mixin="wall primary" position="14.37429 2.5 -11.13354" geometry="width: 6.65" rotation="0 90 0">wall small</a-entity>
        </a-entity>

        <a-plane geometry="height: 2.85" position="11.30641 2.51537 4.74795" width="6" scale="1.02 1.72 1" material="src: #marble-texture"></a-plane>
        
        
     

        <a-sky color="lightblue"></a-sky>

    </a-scene>
</body>
</html>
