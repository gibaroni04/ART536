<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add model to A-frame</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
    <a-scene>
  <a-assets>
    <a-asset-item id="3D_text" src="/models/3d_text.gltf"></a-asset-item> 
  </a-assets>

  <a-entity gltf-model="#3D_text"></a-entity>
</a-scene>
    
</body>
</html>
