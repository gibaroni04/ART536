<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Logo</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
    <a-scene>
  <a-assets>
    <a-asset-item id="Powder_Plus_Logo" src="models/powderplus_logo.gltf"></a-asset-item> 
  </a-assets>

  <a-entity gltf-model="models/powderplus_logo.gltf" scale="0.01 0.01 0.01" position="0 0.32634 -3.49081"></a-entity>

 <a-entity id="basic shapes">
    <a-box position="0 0.51885 -5" rotation="0 45 0" color="red"></a-box>
      <a-sphere position="1.25715 0.52366 -5" radius="1" color="blue" scale="0.5 0.5 0.5"></a-sphere>
      <a-cylinder position="-2 0.98408 -5" radius="1" height="2" color="green"></a-cylinder>
      <a-plane position="0 0.02428 -5" rotation="-90 0 0" width="4" height="4" color="gray"></a-plane>
  </a-entity>
 
</a-scene>
    
</body>
</html>
